name: native_qr_scanner
description: "A fast, cross-platform Flutter plugin for QR and barcode scanning with auto-zoom on Android via Google Play Services and AVFoundation on iOS."
version: 0.0.1
homepage: https://github.com/ShithinCherathuparambil/flutter_qr_scanner
repository: https://github.com/ShithinCherathuparambil/flutter_qr_scanner
issue_tracker: https://github.com/ShithinCherathuparambil/flutter_qr_scanner/issues
topics:
  - qr-code
  - barcode
  - scanner
  - camera
  - google-code-scanner

environment:
  sdk: ^3.13.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.flutter.qr
        pluginClass: FlutterQrScannerPlugin
      ios:
        pluginClass: FlutterQrScannerPlugin
